name: publish-image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "unraid/**"
  workflow_dispatch:
    inputs:
      app_ref:
        description: "dc-water-watch branch, tag or commit to build"
        default: main
      platforms:
        description: "Target platforms (use linux/amd64,linux/arm64 for Oracle Ampere)"
        default: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Pin app commit
        id: ref
        env:
          REF: ${{ inputs.app_ref || 'main' }}
        run: |
          SHA=$(git ls-remote https://github.com/Burnt-Pancakes/dc-water-watch.git "$REF" | cut -f1 | head -n1)
          echo "sha=${SHA:-$REF}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: ${{ contains(inputs.platforms, 'arm64') }}
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_REF=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
